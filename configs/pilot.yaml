# A real-data pipeline pilot; its results must not be called full-data results.
seed: 42
threads: 4
batch_size: 32
workers: 0
device: auto
manifest: data/manifests/images.csv
max_train_per_class: 40
max_validation_per_class: 15
baseline_epochs: 2
head_epochs: 2
fine_tune_epochs: 1
patience: 4
head_lr: 0.001
fine_tune_head_lr: 0.0001
backbone_lr: 0.00001
weight_decay: 0.0001
class_weighted_loss: true
